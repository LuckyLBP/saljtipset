name: Bygg och testa

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # KB-Whisper small q5_0, used by the end-to-end transcription tests.
  TEST_MODEL_URL: https://huggingface.co/KBLab/kb-whisper-small/resolve/main/ggml-model-q5_0.bin
  TEST_MODEL_SHA256: 6768836a51abc902e420c613153e6d418c90ea2774e913274d02ab23170225b7

jobs:
  test:
    name: Tester (${{ matrix.name }})
    # A release tag points at code that was already tested on main.
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64, Metal
            os: macos-latest
            features: gpu-metal
          # GitHub's Windows runners have no GPU, so this also checks that a Vulkan build
          # falls back to the CPU cleanly when there is no usable device.
          - name: Windows, Vulkan utan GPU
            os: windows-latest
            features: gpu-vulkan
    runs-on: ${{ matrix.os }}
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4

      - name: Windows-byggmiljö
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Windows paths max out at 260 characters and whisper.cpp's Vulkan shader build
          # nests deep under target/, so build in a short folder.
          echo 'CARGO_TARGET_DIR=C:\t' >> "$GITHUB_ENV"
          # With Visual Studio, the cmake crate replaces CMake's release flags and drops /O2,
          # which leaves whisper.cpp unoptimized and many times slower. Set them ourselves
          # (whisper-rs-sys passes CMAKE_* through, and cmake then leaves them alone).
          # Dashes, not slashes: Git Bash would turn a leading "/O2" into a file path.
          for v in C CXX; do for t in RELEASE RELWITHDEBINFO; do
            echo "CMAKE_${v}_FLAGS_${t}=-O2 -Ob2 -DNDEBUG" >> "$GITHUB_ENV"
          done; done

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.features }}
          # Windows builds in C:\t (see above), outside what rust-cache saves by default.
          cache-directories: ${{ runner.os == 'Windows' && 'C:\t' || '' }}

      - name: Installera Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      # The Windows build bundles the Vulkan loader (tauri.windows.conf.json), so it must exist.
      - name: Lägg vulkan-1.dll på plats
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-vulkan-loader.ps1

      - name: Hämta testmodellen
        id: model
        uses: actions/cache@v4
        with:
          path: test-model
          key: kb-whisper-small-q5_0-${{ env.TEST_MODEL_SHA256 }}

      - name: Ladda ner testmodellen
        if: steps.model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p test-model
          curl -fL --retry 3 -o test-model/model.bin "$TEST_MODEL_URL"
          # Windows' Git Bash has sha256sum, macOS has shasum.
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          echo "$TEST_MODEL_SHA256  test-model/model.bin" | $sum -c -

      # The Tauri build script expects the frontend output to exist.
      - name: Frontend-platshållare
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Kör tester
        shell: bash
        working-directory: src-tauri
        env:
          SALJTIPSET_TEST_MODEL: ${{ github.workspace }}/test-model/model.bin
        run: cargo test --features ${{ matrix.features }} -- --nocapture

  build:
    name: Bygg (${{ matrix.name }})
    needs: test
    if: >-
      always() && (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            features: gpu-metal
          # Built natively on an Intel runner: cross-compiling whisper.cpp to x86_64 is fragile.
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            features: ""
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: gpu-vulkan
    runs-on: ${{ matrix.os }}
    env:
      # x86 builds must run on any customer CPU, not just the CI machine's (AVX2 baseline).
      GGML_NATIVE: ${{ matrix.target == 'aarch64-apple-darwin' && 'ON' || 'OFF' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Windows-byggmiljö
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Windows paths max out at 260 characters and whisper.cpp's Vulkan shader build
          # nests deep under target/, so build in a short folder.
          echo 'CARGO_TARGET_DIR=C:\t' >> "$GITHUB_ENV"
          # With Visual Studio, the cmake crate replaces CMake's release flags and drops /O2,
          # which leaves whisper.cpp unoptimized and many times slower. Set them ourselves
          # (whisper-rs-sys passes CMAKE_* through, and cmake then leaves them alone).
          # Dashes, not slashes: Git Bash would turn a leading "/O2" into a file path.
          for v in C CXX; do for t in RELEASE RELWITHDEBINFO; do
            echo "CMAKE_${v}_FLAGS_${t}=-O2 -Ob2 -DNDEBUG" >> "$GITHUB_ENV"
          done; done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          cache-directories: ${{ runner.os == 'Windows' && 'C:\t' || '' }}

      - name: Installera Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Lägg vulkan-1.dll i installationspaketet
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-vulkan-loader.ps1

      - run: pnpm install --frozen-lockfile

      # --- Windows code signing (optional) -------------------------------------------
      # Add the secrets WINDOWS_CERTIFICATE (base64 of the .pfx) and
      # WINDOWS_CERTIFICATE_PASSWORD. Without them the installer is unsigned.
      - name: Importera Authenticode-certifikat
        id: wincert
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          $json = '{"bundle":{"windows":{"certificateThumbprint":"' + $cert.Thumbprint + '"}}}'
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "sign.conf.json") -Value $json
          "config=--config `"$env:RUNNER_TEMP\sign.conf.json`"" >> $env:GITHUB_OUTPUT

      # --- In-app updates (optional) -------------------------------------------------
      # Set the repository variable ENABLE_UPDATER=true and the secrets
      # TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD, and fill in
      # src-tauri/tauri.updater.conf.json. See README "Uppdateringar".
      - name: Byggflaggor
        id: flags
        shell: bash
        run: |
          features="${{ matrix.features }}"
          extra=""
          if [ "${{ vars.ENABLE_UPDATER }}" = "true" ]; then
            features="${features:+$features,}updater"
            extra="--config src-tauri/tauri.updater.conf.json"
          fi
          # Windows builds natively without --target: the extra target folder in the build
          # path would push whisper.cpp's Vulkan build past the 260-character path limit.
          target=""
          if [ "${{ runner.os }}" != "Windows" ]; then target="--target ${{ matrix.target }}"; fi
          echo "args=$target ${features:+--features $features} $extra ${{ steps.wincert.outputs.config }}" >> "$GITHUB_OUTPUT"

      # --- macOS signing + notarization (optional) -----------------------------------
      # Add APPLE_CERTIFICATE (base64 of the Developer ID .p12), APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID as secrets. They are
      # only handed to the build when a certificate exists: Tauri tries to sign with whatever
      # it gets, and an empty certificate fails the build. Without them the .dmg is unsigned
      # and Gatekeeper warns. See README.
      - name: Apple-signering
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          C: ${{ secrets.APPLE_CERTIFICATE }}
          CP: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SI: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AI: ${{ secrets.APPLE_ID }}
          AP: ${{ secrets.APPLE_PASSWORD }}
          AT: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE=$C"
            echo "APPLE_CERTIFICATE_PASSWORD=$CP"
            echo "APPLE_SIGNING_IDENTITY=$SI"
            echo "APPLE_ID=$AI"
            echo "APPLE_PASSWORD=$AP"
            echo "APPLE_TEAM_ID=$AT"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- updater signing (only used when ENABLE_UPDATER=true) --------------------
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ steps.flags.outputs.args }}
          # On a tag: attach the .dmg / .msi / setup.exe to a draft release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Bubbe ${{ github.ref_name }}
          releaseDraft: true
          # Manual runs: keep the installers as workflow artifacts instead (one per bundle
          # type, or the names collide).
          uploadWorkflowArtifacts: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          workflowArtifactNamePattern: bubbe_[platform]_[arch]_[bundle]

      # bubbe.exe must start on a fresh Windows, which may lack the Visual C++ runtime
      # (src-tauri/.cargo/config.toml links it in). Fail rather than ship one that needs it.
      - name: Kontrollera Windows-bygget (VC++-runtime, optimering)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --quiet pefile
          python - <<'EOF'
          import re, sys, pefile
          pe = pefile.PE(r"C:\t\release\bubbe.exe", fast_load=True)
          pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_IMPORT"]])
          dlls = [e.dll.decode() for e in pe.DIRECTORY_ENTRY_IMPORT]
          print("Importerar:", ", ".join(dlls))
          bad = [d for d in dlls if re.match(r"(msvcp|vcruntime|concrt)\d+", d, re.I)]
          if bad:
              sys.exit(f"bubbe.exe kräver {', '.join(bad)}, som saknas på många datorer.")
          EOF
          # And that whisper.cpp was compiled optimized (see "Windows-byggmiljö").
          cache=$(ls /c/t/release/build/whisper-rs-sys-*/out/build/CMakeCache.txt | head -1)
          grep -E '^CMAKE_CXX_FLAGS_RELEASE' "$cache"
          grep -qE '^CMAKE_CXX_FLAGS_RELEASE:[A-Z]+=.*[-/]O2' "$cache" || { echo "whisper.cpp byggdes utan /O2"; exit 1; }
